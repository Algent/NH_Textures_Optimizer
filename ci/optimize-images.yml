# Proposed replacement for GTNH-Actions-Workflows/.github/workflows/optimize-images.yml.
# It runs the exact wasm optimiser the site serves (via cli.mjs), so anything optimised on the site
# passes, and anything this job fixes is what the site would have produced.
name: Check for image compression

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://algent.github.io/NH_Textures_Optimizer/

jobs:
  compress:
    name: Compress and make a PR if needed
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Fetch optimizer
        run: |
          mkdir -p "$RUNNER_TEMP/nhto/pkg"
          for f in cli.mjs pkg/nh_png.js pkg/nh_png_bg.wasm; do
            curl -sSfLo "$RUNNER_TEMP/nhto/$f" "$SITE_URL$f"
          done

      - name: Optimize PNG files
        run: |
          if [ "${{ github.event_name }}" = pull_request ] &&
             [ "${{ !github.event.pull_request.draft }}" = true ]; then
            git fetch origin "$GITHUB_BASE_REF:$GITHUB_BASE_REF"
            git diff -z --name-only --diff-filter=AM --no-renames "origin/$GITHUB_BASE_REF" -- '*.png'
          else
            git ls-files -z -- '*.png'
          fi | xargs -0 -r node "$RUNNER_TEMP/nhto/cli.mjs"

      - name: Check for changes
        id: check_changes
        run: |
          changed=$(git diff --name-only)
          if [ -n "$changed" ]; then
            echo "needs_compression=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Some PNGs are not optimised"
              echo "Run them through $SITE_URL and commit the result:"
              echo '```'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needs_compression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request if Needed
        if: ${{ steps.check_changes.outputs.needs_compression == 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git config user.name "GitHub GTNH Actions"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com" &&
          git switch -c "${FIXED_BRANCH}"
          git commit -am "optimizing images"
          git push --force-with-lease origin "${FIXED_BRANCH}"
          gh pr create \
            --head "${FIXED_BRANCH}" \
            --base "${PR_BRANCH}" \
            --title "Optimising images contained in ${PR_BRANCH} for #${{ github.event.pull_request.number }}" \
            --body "Automatic image compression, applies to PR #${{ github.event.pull_request.number }}" \
            2>&1 | tee pr-message.log || true
          gh pr comment "${{ github.event.pull_request.number }}" -F pr-message.log || true
        shell: bash # ensures set -eo pipefail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.head_ref }}
          FIXED_BRANCH: ${{ github.head_ref }}-image-compression

      - name: Fail for forks
        if: ${{ steps.check_changes.outputs.needs_compression == 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Some PNGs are not optimised. Run them through $SITE_URL and push the result (see the job summary)."
          exit 1
